# Import from the http {} context. The local CrowdSec GeoLite2 City database
# supplies both IPv4 and IPv6 country lookups and is refreshed by CrowdSec.
include /etc/nginx/snippets/oneshield-realip.conf;

geoip2 /var/lib/crowdsec/data/GeoLite2-City.mmdb {
    $geoip2_data_country_code country iso_code;
}

map $geoip2_data_country_code $block_country {
    default 0;
    VN 0; # Vietnam is explicitly allowed by country policy.
    CN 1; # China
    RU 1; # Russia
    SY 1; # Syria
    UA 1; # Ukraine
    AL 1; # Albania
    IR 1; # Iran
    KP 1; # North Korea
    BG 1; # Bulgaria
}

map $remote_addr $permanent_web_attack_ban {
    default 0;
    include /var/lib/crowdsec/permanent-web-attack-map.conf;
}

# The upstream-derived list is only a permanent-ban exception. It does not
# disable ModSecurity or any Nginx request-rate limit.
geo $trusted_crawler_ip {
    default 0;
    include /var/lib/crowdsec/trusted-crawler-map.conf;
}
